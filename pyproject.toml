[project]
name = "onco-causal"
version = "0.2.0"
description = "Engenharia Preditiva e Inferência Causal na Epidemiologia Ambiental e Oncológica nos 5.570 Municípios Brasileiros"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Eduardo Rewell", email = "dudurewell@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "esda>=2.10.0",
    "geopandas>=1.2.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-bigquery-storage>=2.43.0",
    "httpx>=0.28.1",
    "libpysal>=4.15.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=9.2.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.12.20261030",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: Testes unitários com dados sintéticos em memória (sem IO de dados reais)",
    "data_contract: Testes de integridade sobre artefatos Parquet reais em data/staging/",
    "integration: Testes ponta-a-ponta de engine e queries",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false

